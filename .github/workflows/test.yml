name: Test API

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check source
        run: npm run build
      - name: Run API tests
        run: npm test
      - name: Build Docker image
        run: docker build -t animal-picture-api .
